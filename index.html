<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>韓文學習筆記｜韓檢初級單字與句型</title>
<meta name="theme-color" content="#f6f1ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1ea; --paper:#fffdf9; --ink:#2b2622; --muted:#7a6f66; --line:#e6ddd2;
    --accent:#c8553d; --accent-soft:#f6e3dc; --ko:#1f4e79; --ok:#3f7d58;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:110px}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.7 "Noto Sans TC","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:20;background:rgba(246,241,234,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 16px 8px}
  .top{display:flex;gap:8px;align-items:center;max-width:960px;margin:0 auto}
  .brand{font-weight:700;font-size:17px;white-space:nowrap}
  .brand span{color:var(--accent)}
  .mode{margin-left:auto;display:flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
  .mode button{border:0;background:none;padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
  .mode button.on{background:var(--ink);color:#fff}
  .tools{max-width:960px;margin:8px auto 0;display:flex;gap:8px}
  #q{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font:inherit;font-size:15px}
  nav#toc{max-width:960px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  nav#toc::-webkit-scrollbar{display:none}
  nav#toc a{flex:none;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink);text-decoration:none;white-space:nowrap}
  nav#toc a:hover{border-color:var(--accent)}
  main{max-width:960px;margin:0 auto;padding:12px 16px 80px}
  #notes h1{font-size:26px;margin:18px 0 6px}
  #notes h2{font-size:21px;margin:36px 0 10px;padding-left:10px;border-left:4px solid var(--accent)}
  #notes h3{font-size:17px;margin:26px 0 8px;color:var(--accent)}
  #notes p,#notes li{max-width:70ch}
  .tablewrap{overflow-x:auto;margin:10px 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
  table{border-collapse:collapse;width:100%;font-size:15px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#f1e9df;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .ko{color:var(--ko);font-family:"Noto Sans KR",sans-serif;cursor:pointer;border-radius:4px}
  .ko:hover{background:#e7eef6}
  .ko.speaking{background:#d6e4f2}
  tr.hide{display:none}
  section.hide{display:none}
  .hint{font-size:13px;color:var(--muted)}
  /* flashcards */
  #cards{display:none}
  .deckbar{display:flex;gap:6px;margin:14px 0;overflow-x:auto;scrollbar-width:none}
  .deckbar::-webkit-scrollbar{display:none}
  .deckbar button{flex:none}
  .deckbar button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
  .deckbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dirbar{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
  .dirbar button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
  .dirbar button.on{background:var(--ink);color:#fff}
  .card .front.zh{font-family:"Noto Sans TC";color:var(--ink);font-size:36px}
  .card .sub{font-size:22px;font-weight:700;margin-top:8px}
  .card .sub.ko{font-family:"Noto Sans KR";color:var(--ko);cursor:pointer}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;min-height:280px;padding:28px 20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;
    box-shadow:0 6px 24px rgba(60,40,20,.06);user-select:none}
  .card .front{font-family:"Noto Sans KR";font-size:44px;font-weight:700;color:var(--ko);line-height:1.2}
  .card .back{margin-top:16px;display:none}
  .card.flipped .back{display:block}
  .card .meaning{font-size:24px;font-weight:700}
  .card .extra{margin-top:10px;color:var(--muted);font-size:15px}
  .card .extra .kx{font-family:"Noto Sans KR";color:var(--ko)}
  .row{display:flex;gap:10px;margin-top:14px}
  .row button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:16px;cursor:pointer}
  .row .again{color:var(--accent)} .row .know{background:var(--ok);border-color:var(--ok);color:#fff}
  .stat{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:12px}
  .stat button{border:0;background:none;color:var(--muted);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer}
  /* mascot */
  #mascot{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:108px;height:122px;cursor:pointer;filter:drop-shadow(0 4px 10px rgba(60,40,20,.18));
    -webkit-tap-highlight-color:transparent}
  #mascot svg{width:100%;height:100%;overflow:visible;animation:bob 2.6s ease-in-out infinite}
  #mascot .earL{transform-origin:56px 22px;animation:earL 3.2s ease-in-out infinite}
  #mascot .earR{transform-origin:62px 34px;animation:earR 3.2s ease-in-out infinite}
  #mascot .paw{transform-origin:76px 84px;animation:wave 1.2s ease-in-out 3}
  #mascot.hello .paw{animation:wave 1.2s ease-in-out 2}
  #mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
  #mascot.hop svg{animation:hop .5s ease}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes earL{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(-.6px)}}
  @keyframes earR{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
  @keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-25deg)}75%{transform:rotate(15deg)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.04)}100%{transform:translateY(0)}}
  #bubble{position:fixed;right:112px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;max-width:230px;background:var(--paper);
    border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:10px 14px;box-shadow:0 6px 20px rgba(60,40,20,.12);
    opacity:0;transform:translateY(8px) scale(.95);transition:opacity .3s,transform .3s;pointer-events:none}
  #bubble.show{opacity:1;transform:none}
  #bubble .k{font-family:"Noto Sans KR";font-weight:700;color:var(--ko);font-size:17px}
  #bubble .z{font-size:13px;color:var(--muted)}
  main{padding-bottom:140px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
</style>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const HANGUL = /[가-힣]/;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- speech ---------- */
let koVoice = null;
function pickVoice(){
  try{ const vs = speechSynthesis.getVoices(); koVoice = vs.find(v => /ko(-|_)KR/i.test(v.lang)) || vs.find(v => /^ko/i.test(v.lang)) || null; }catch(e){}
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function koOnly(t){
  // keep Hangul, digits, spaces and basic punctuation; drop Chinese notes
  return t.replace(/[（(][^）)]*[）)]/g,' ').replace(/[^가-힣ㄱ-ㆎ0-9 ,.?!~\-\/]/g,' ').replace(/\s+/g,' ').trim();
}
function speak(text, el){
  if (!('speechSynthesis' in window)) return;
  const t = koOnly(text); if (!t) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ko-KR'; u.rate = 0.85; if (koVoice) u.voice = koVoice;
    if (el){ el.classList.add('speaking'); u.onend = u.onerror = () => el.classList.remove('speaking'); }
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- notes ---------- */
const notes = document.getElementById('notes');
const toc = document.getElementById('toc');
let decks = [];

function wrapSections(){
  // group each h2 + following nodes into a <section>
  const nodes = [...notes.childNodes];
  let cur = null;
  nodes.forEach(n => {
    if (n.nodeName === 'H2'){ cur = document.createElement('section'); notes.insertBefore(cur, n); }
    if (cur) cur.appendChild(n);
  });
}

function markKorean(){
  notes.querySelectorAll('td').forEach(td => {
    if (HANGUL.test(td.textContent)){ td.classList.add('ko'); td.title = '點一下聽發音'; }
  });
}

function buildToc(){
  toc.innerHTML = '';
  notes.querySelectorAll('h2').forEach((h, i) => {
    h.id = 's' + i;
    const a = document.createElement('a');
    a.href = '#s' + i;
    a.textContent = h.textContent.replace(/^(句法.)[：:]/, '$1·').replace(/^單字[：:]/, '').replace(/（[^）]*個）/, '').trim();
    toc.appendChild(a);
  });
}

function buildDecks(){
  decks = [];
  notes.querySelectorAll('section').forEach(sec => {
    const h = sec.querySelector('h2'); if (!h) return;
    const title = h.textContent;
    const cards = [];
    sec.querySelectorAll('table').forEach(tb => {
      const heads = [...tb.querySelectorAll('th')].map(th => th.textContent.trim());
      tb.querySelectorAll('tbody tr').forEach(tr => {
        const tds = [...tr.children].map(td => td.textContent.trim());
        const ki = tds.findIndex(t => HANGUL.test(t));
        if (ki < 0 || ki + 1 >= tds.length) return;
        const word = tds[ki].replace(/[※]|〔連〕/g,'').trim();
        const meaning = tds[ki + 1];
        if (HANGUL.test(meaning)) return; // skip grammar rows where next col is also Korean
        const exIdx = heads.findIndex(x => x === '例句' || x === '例子');
        const ex = exIdx > -1 ? tds[exIdx] : '';
        const exZh = exIdx > -1 && tds[exIdx + 1] ? tds[exIdx + 1] : '';
        cards.push({ word, meaning, ex, exZh });
      });
    });
    if (cards.length >= 5 && /^單字/.test(title)) decks.push({ title: title.replace(/^單字[：:]/,'').replace(/（[^）]*個）/,'').trim(), cards });
  });
}

function render(md){
  notes.innerHTML = marked.parse(md);
  notes.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'tablewrap';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  wrapSections(); markKorean(); buildToc(); buildDecks(); drawDecks();
}

notes.addEventListener('click', e => {
  const td = e.target.closest('td.ko'); if (td) speak(td.textContent, td);
});

/* ---------- search ---------- */
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  notes.querySelectorAll('section').forEach(sec => {
    let any = !q;
    sec.querySelectorAll('tbody tr').forEach(tr => {
      const hit = !q || tr.textContent.toLowerCase().includes(q);
      tr.classList.toggle('hide', !hit); if (hit) any = true;
    });
    if (q && sec.textContent.toLowerCase().includes(q)) any = true;
    sec.classList.toggle('hide', !any);
  });
});

/* ---------- flashcards ---------- */
let deckIdx = 0, queue = [], current = null;
const known = store.get('ko-known', {});
const $ = id => document.getElementById(id);

function drawDecks(){
  const bar = $('decks'); bar.innerHTML = '';
  decks.forEach((d, i) => {
    const b = document.createElement('button');
    b.textContent = d.title + '（' + d.cards.length + '）';
    if (i === deckIdx) b.className = 'on';
    b.onclick = () => { deckIdx = i; drawDecks(); startDeck(); };
    bar.appendChild(b);
  });
  if (decks.length) startDeck();
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startDeck(){
  const d = decks[deckIdx];
  queue = shuffle(d.cards.filter(c => !known[c.word]));
  next();
}
function next(){
  const d = decks[deckIdx];
  const done = d.cards.filter(c => known[c.word]).length;
  $('cStat').textContent = '已記住 ' + done + ' / ' + d.cards.length;
  $('card').classList.remove('flipped');
  current = queue.shift() || null;
  if (!current){
    $('cFront').textContent = '這組全部記住了 🎉';
    $('cMeaning').textContent = ''; $('cExtra').textContent = '';
    return;
  }
  const f = $('cFront');
  if (dir === 'zh'){
    f.className = 'front zh'; f.textContent = current.meaning;
    $('cMeaning').className = 'sub ko'; $('cMeaning').textContent = current.word;
  } else if (dir === 'both'){
    f.className = 'front'; f.innerHTML = current.word + '<div class="sub" style="font-family:Noto Sans TC;color:var(--ink)">' + current.meaning + '</div>';
    $('cMeaning').className = 'meaning'; $('cMeaning').textContent = '';
  } else {
    f.className = 'front'; f.textContent = current.word;
    $('cMeaning').className = 'meaning'; $('cMeaning').textContent = current.meaning;
  }
  $('cExtra').innerHTML = current.ex ? '<div class="kx">' + current.ex + '</div><div>' + (HANGUL.test(current.exZh) ? '' : current.exZh) + '</div>' : '';
  if (dir === 'both') $('card').classList.add('flipped');
}
let dir = store.get('ko-dir', 'ko');
function drawDirs(){ document.querySelectorAll('#dirs button').forEach(b => b.classList.toggle('on', b.dataset.d === dir)); }
document.querySelectorAll('#dirs button').forEach(b => b.onclick = () => { dir = b.dataset.d; store.set('ko-dir', dir); drawDirs(); if (current) queue.unshift(current); next(); });
drawDirs();
$('card').onclick = () => {
  if (!current) return;
  const c = $('card');
  if (!c.classList.contains('flipped')){ c.classList.add('flipped'); speak(current.word); }
  else speak(current.ex || current.word);
};
$('bKnow').onclick = () => { if (!current) return; known[current.word] = 1; store.set('ko-known', known); next(); };
$('bAgain').onclick = () => { if (!current) return; queue.splice(Math.min(3, queue.length), 0, current); next(); };
$('bSpeak').onclick = () => { if (current) speak(current.word); };
$('bReset').onclick = () => { decks[deckIdx].cards.forEach(c => delete known[c.word]); store.set('ko-known', known); startDeck(); };

/* ---------- mascot ---------- */
// 打開網頁時的招呼語（想換句子就改這裡）
const GREETING = { ko: '안녕하세요! 저랑 같이 한국어 공부해요!', zh: '你好！來跟我一起學習韓文吧！' };
const PHRASES = [
  { ko: '오늘도 화이팅!', zh: '今天也加油！' },
  { ko: '잘하고 있어요!', zh: '你做得很好！' },
  { ko: '조금만 더 힘내요!', zh: '再加油一下下！' },
  { ko: '천천히 해도 괜찮아요.', zh: '慢慢來也沒關係。' },
  { ko: '오늘 단어 다 외웠어요?', zh: '今天的單字都背了嗎？' },
  { ko: '최고예요!', zh: '你最棒了！' }
];
let bubbleTimer = null, greeted = false, pi = 0;
function say(p, withVoice){
  $('bK').textContent = p.ko; $('bZ').textContent = p.zh;
  $('bubble').classList.add('show');
  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => $('bubble').classList.remove('show'), 4500);
  if (withVoice) speak(p.ko);
}
$('mascot').onclick = () => {
  const m = $('mascot'); m.classList.remove('hop'); void m.offsetWidth; m.classList.add('hop');
  const p = greeted ? PHRASES[pi++ % PHRASES.length] : GREETING;
  greeted = true; say(p, true);
};
// 開頁就打招呼（電腦會念出來；iPhone 不允許網頁自動發聲，點一下兔子就會念）
setTimeout(() => say(GREETING, true), 700);

/* ---------- mode switch ---------- */
function setMode(cards){
  $('mNotes').classList.toggle('on', !cards); $('mCards').classList.toggle('on', cards);
  notes.style.display = cards ? 'none' : ''; $('cards').style.display = cards ? 'block' : 'none';
  $('searchbar').style.display = cards ? 'none' : ''; toc.style.display = cards ? 'none' : '';
  window.scrollTo(0, 0);
}
$('mNotes').onclick = () => setMode(false);
$('mCards').onclick = () => setMode(true);

fetch('content.md', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => { render(md); if (/cards/.test(location.hash)) setMode(true); })
  .catch(() => { notes.innerHTML = '<p>找不到 content.md。請確認它和 index.html 放在同一個資料夾。</p>'; });
</script>
</body>
</html>
